[project]
name = "aether-sample-agents"
version = "0.1.0"
description = "Sample tool APIs and external agents for exercising Aether (fictional brands)."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "truststore>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sample_agents"]
