[project]
name = "aether"
version = "0.1.0"
description = "Aether: evaluate AI agents for reliability, tool-calling accuracy, latency and cost across models and prompts."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "certifi>=2026.10.19",
    "cryptography>=50.0.2",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.0",
    "truststore>=0.10.5",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
aether = "aether.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aether"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: calls real model providers (needs credentials)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109", "ASYNC240"]
